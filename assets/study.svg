<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc"><title id="title">Measured ResearchPi classification study</title><desc id="desc">Actual twenty-run Wisconsin dataset experiment. Ten training seeds per configuration; values are mean and sample standard deviation on one fixed split.</desc><rect width="1280" height="600" rx="20" fill="#f4f8fb"/><rect x="37" y="30" width="198" height="30" rx="15" fill="#d7f4e9"/><g font-family="Arial,Helvetica,sans-serif"><text x="56" y="51" font-size="13" font-weight="700" fill="#23634d">ACTUAL MEASUREMENTS</text><text x="42" y="99" font-size="34" font-weight="700" fill="#102338">A complete, traceable classification study</text><path d="M42 222H1220M42 298H1220M42 367H1220" stroke="#d5e1ea"/><text x="42" y="132" fill="#425e75" font-size="22">569 observations · 30 features · fixed stratified holdout</text><text x="42" y="205" fill="#5a6f80" font-size="16">Configuration</text><text x="450" y="205" fill="#5a6f80" font-size="16">Accuracy: mean ± sample SD</text><text x="835" y="205" fill="#5a6f80" font-size="16">Log loss: mean ± sample SD</text><text x="42" y="261" fill="#102338" font-size="22">sgd-logistic</text><text x="450" y="261" fill="#102338" font-size="22">0.969231 ± 0.009999</text><text x="835" y="261" fill="#102338" font-size="22">0.098903 ± 0.015483</text><text x="42" y="332" fill="#102338" font-size="22">random-forest</text><text x="450" y="332" fill="#102338" font-size="22">0.948252 ± 0.009999</text><text x="835" y="332" fill="#102338" font-size="22">0.108138 ± 0.005314</text><text x="42" y="397" fill="#102338" font-size="22">20 measured runs</text><text x="42" y="437" fill="#425e75" font-size="18">10 distinct seeds / configuration</text><text x="42" y="486" fill="#425e75" font-size="18">Protocol → Receipts → Predictions → Recalculated table</text><text x="42" y="554" fill="#5a6f80" font-size="16">One fixed dataset and split. No clinical validation or general superiority claim.</text></g></svg>
