<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc"><title id="title">Measured ResearchPi classification study</title><desc id="desc">Actual twenty-run Wisconsin dataset experiment. Ten training seeds per configuration; values are mean and sample standard deviation on one fixed split.</desc><style>text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}.title{font-family:Newsreader,Charter,Georgia,serif}@media(prefers-color-scheme:dark){[fill="#fbfaf7"]{fill:#121211}[fill="#1c1b19"]{fill:#ecebe6}[fill="#66645e"]{fill:#a19f97}[fill="#8f8c84"]{fill:#77756e}[stroke="#e4e1d9"]{stroke:#2a2926}}</style><rect width="1280" height="600" fill="#fbfaf7"/><g><text x="42" y="51" font-size="13" font-weight="500" letter-spacing="2" fill="#8f8c84">ACTUAL MEASUREMENTS</text><text class="title" x="42" y="99" font-size="38" fill="#1c1b19">A complete, traceable classification study</text><path d="M42 222H1220M42 298H1220M42 367H1220" stroke="#e4e1d9"/><text x="42" y="132" fill="#66645e" font-size="22">569 observations · 30 features · fixed stratified holdout</text><text x="42" y="205" fill="#8f8c84" font-size="16">Configuration</text><text x="450" y="205" fill="#8f8c84" font-size="16">Accuracy: mean ± sample SD</text><text x="835" y="205" fill="#8f8c84" font-size="16">Log loss: mean ± sample SD</text><text x="42" y="261" fill="#1c1b19" font-size="22">sgd-logistic</text><text x="450" y="261" fill="#1c1b19" font-size="22">0.969231 ± 0.009999</text><text x="835" y="261" fill="#1c1b19" font-size="22">0.098903 ± 0.015483</text><text x="42" y="332" fill="#1c1b19" font-size="22">random-forest</text><text x="450" y="332" fill="#1c1b19" font-size="22">0.948252 ± 0.009999</text><text x="835" y="332" fill="#1c1b19" font-size="22">0.108138 ± 0.005314</text><text x="42" y="397" fill="#1c1b19" font-size="22">20 measured runs</text><text x="42" y="437" fill="#66645e" font-size="18">10 distinct seeds / configuration</text><text x="42" y="486" fill="#66645e" font-size="18">Protocol → Receipts → Predictions → Recalculated table</text><text x="42" y="554" fill="#8f8c84" font-size="16">One fixed dataset and split. No clinical validation or general superiority claim.</text></g></svg>
