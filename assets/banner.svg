<g transform="translate(838 99)"><rect width="366" height="236" rx="16" fill="#0c1b2b" stroke="#36516a"/><circle cx="25" cy="25" r="5" fill="#ff9e9e"/><circle cx="44" cy="25" r="5" fill="#f0cf81"/><circle cx="63" cy="25" r="5" fill="#9bedd8"/><g font-family="monospace" font-size="16"><text x="25" y="75" fill="#9bedd8">$ repi</text><text x="25" y="112" fill="#d1dfed">Question → Protocol</text><text x="25" y="147" fill="#88afff">Runs → Measurements</text><text x="25" y="182" fill="#9bedd8">Audit → Evidence</text><text x="25" y="213" fill="#738ea8" font-size="12">Workflow illustration</text></g></g></g></svg>
