<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">ResearchPi</title><desc id="desc">Reproducible research, from question to evidence. An open-source research harness for machine learning, AI and computer science.</desc>
<defs><linearGradient id="bg"><stop stop-color="#102338"/><stop offset="1" stop-color="#182f48"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b9d1e9" stroke-opacity=".055"/></pattern></defs>
<rect width="1280" height="420" rx="20" fill="url(#bg)"/><rect width="1280" height="420" rx="20" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="68" y="72" fill="#9bedd8" font-size="14" font-weight="700" letter-spacing="3">OPEN SOURCE · BUILT ON THE PI SDK</text><text x="64" y="165" fill="#f2f7fc" font-size="76" font-weight="700">ResearchPi</text><text x="68" y="219" fill="#d1dfed" font-size="28">Reproducible research, from question to evidence.</text><text x="68" y="263" fill="#99b3cc" font-size="19">Machine learning · Artificial intelligence · Computer science</text>
