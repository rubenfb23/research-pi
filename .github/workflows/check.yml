name: ResearchPi checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: ./research-pi setup --experiments
      - run: npm run check
      - run: ./research-pi --project examples/ci-demo demo
      - run: ./research-pi --project examples/ci-demo audit
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: demo-evidence
          path: examples/ci-demo/.research-pi/
          include-hidden-files: true
          retention-days: 7
