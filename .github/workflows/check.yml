name: ResearchPi checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: npm run check
      - run: npm run demo
      - run: node dist/cli.js audit
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: demo-evidence
          path: .research-pi/
          include-hidden-files: true
          retention-days: 7
