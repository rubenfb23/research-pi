name: ResearchPi checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.0'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: node repi setup --experiments
      - run: npm run check
      - run: node repi --project examples/ci-demo demo
      - run: node repi --project examples/ci-demo audit
      - run: node repi --project examples/ci-real-study demo --dataset breast-cancer
      - run: node repi --project examples/ci-real-study audit
      - run: node repi --project examples/ci-bench bench run --agent fixture
      - run: node repi --project examples/ci-research-bench bench research run --fixture
      - run: node scripts/build-site.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: demo-evidence
          path: |
            examples/ci-demo/.research-pi/
            examples/ci-real-study/.research-pi/
            examples/ci-bench/.research-pi/
            examples/ci-research-bench/.research-pi/
          include-hidden-files: true
          retention-days: 7
